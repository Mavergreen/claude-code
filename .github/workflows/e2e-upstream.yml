name: e2e-upstream

# spec: tests/e2e/run.sh -- Claude Code upstream is not an ingredient: the launcher fetches whatever
#       Anthropic's CDN serves. So once a day, when the CDN's latest is a version this check has not
#       yet passed, the latest released claude-code runs the e2e against it on 10.9 with AVX2 hidden,
#       and this goes red if upstream broke something obvious. A version is recorded as seen only
#       after it passes, so a failure stays red, daily, until fixed.
on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.latest.outputs.version }}
      seen: ${{ steps.seen.outputs.cache-hit }}
    steps:
      - name: The CDN's latest Claude Code
        id: latest
        run: |
          set -eu
          v="$(curl -fsSL --connect-timeout 20 --max-time 60 https://downloads.claude.ai/claude-code-releases/latest | tr -d '[:space:]')"
          case "$v" in ''|*[!0-9.]*) echo "::error::unexpected answer from the CDN: '$v'"; exit 1 ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "upstream latest: $v"
      - name: Already passed?
        id: seen
        uses: actions/cache/restore@v6
        with:
          path: .e2e-passed
          key: e2e-upstream-${{ steps.latest.outputs.version }}
          lookup-only: true

  on-mavericks:
    needs: [upstream]
    if: needs.upstream.outputs.seen != 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/on-mavericks.yml
    secrets:
      MAVERICKS_VM_KEY: ${{ secrets.MAVERICKS_VM_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  passed:
    needs: [upstream, on-mavericks]
    if: needs.upstream.outputs.seen != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: mkdir .e2e-passed && printf '%s\n' "${{ needs.upstream.outputs.version }}" > .e2e-passed/version
      - uses: actions/cache/save@v6
        with:
          path: .e2e-passed
          key: e2e-upstream-${{ needs.upstream.outputs.version }}
